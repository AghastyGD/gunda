[workspace]
members = [
    "crates/gunda-core",
    "crates/gunda-storage",
    "crates/gunda-http",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Augusto Domingos"]
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/AghastyGD/gunda"

[workspace.dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
tempfile = "3"
time = "0.3"
tokio = {version = "1", features = ["macros", "rt-multi-thread"]}
url = "2"
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
