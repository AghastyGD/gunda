<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gunda - Download details</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fa;
        --surface: #ffffff;
        --line: #d5dee7;
        --text: #1f2934;
        --muted: #5c6c7c;
        --accent: #1a68b5;
        --accent-ink: #ffffff;
        --danger: #a23a2c;
        --track: #e3eaf1;
        --hover: #edf2f7;
        font-family: "Segoe UI Variable Text", "Segoe UI", ui-sans-serif, system-ui,
          -apple-system, sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #13171d;
          --surface: #191f28;
          --line: #374352;
          --text: #e5ebf2;
          --muted: #9ba8b8;
          --accent: #519df0;
          --accent-ink: #0e1824;
          --danger: #e09184;
          --track: #2b3542;
          --hover: #232c38;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 18px 20px 20px;
      }

      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .state {
        color: var(--muted);
        font-size: 12px;
      }

      .setup {
        display: grid;
        gap: 14px;
      }

      .format {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
      }

      .format strong,
      .format span {
        display: block;
      }

      .format strong {
        font-size: 13px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .format span {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }

      input {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font: inherit;
        min-width: 0;
        padding: 7px 10px;
        width: 100%;
      }

      input:focus {
        border-color: var(--accent);
        outline: 2px solid color-mix(in srgb, var(--accent) 22%, transparent);
        outline-offset: 0;
      }

      .address {
        color: var(--text);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
      }

      .browser-only {
        display: none;
      }

      body.browser-prompt .field.browser-only {
        display: grid;
      }

      body.browser-prompt .meta {
        display: grid;
      }

      .meta {
        display: none;
        gap: 6px;
      }

      .remember {
        align-items: center;
        color: var(--muted);
        cursor: pointer;
        display: flex;
        font-size: 12px;
        gap: 8px;
      }

      .remember input {
        accent-color: var(--accent);
        height: 14px;
        margin: 0;
        width: 14px;
      }

      .source {
        align-items: baseline;
        color: var(--muted);
        display: flex;
        font-size: 11px;
        gap: 6px;
        min-width: 0;
      }

      .source-label {
        flex: none;
      }

      .source-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .directory {
        display: flex;
        gap: 8px;
      }

      .directory input {
        flex: 1;
      }

      .progress {
        display: none;
      }

      .source-line {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 16px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px;
      }

      .status-line {
        align-items: baseline;
        display: flex;
        gap: 12px;
        justify-content: space-between;
      }

      .status-line .state {
        color: var(--accent);
        font-weight: 600;
      }

      .percent {
        color: var(--text);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .track {
        background: var(--track);
        border-radius: 3px;
        height: 6px;
        margin: 12px 0 14px;
        overflow: hidden;
      }

      .bar {
        background: var(--accent);
        height: 100%;
        transition: width 180ms ease;
        width: 0;
      }

      .metrics {
        display: grid;
        gap: 12px 16px;
        grid-template-columns: 1fr 1fr;
      }

      .metric {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .metric span {
        color: var(--muted);
        font-size: 11px;
      }

      .metric strong {
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .details {
        display: grid;
        gap: 8px;
        margin-top: 16px;
      }

      .detail {
        align-items: baseline;
        display: grid;
        gap: 8px;
        grid-template-columns: 72px 1fr;
        min-width: 0;
      }

      .detail span {
        color: var(--muted);
        font-size: 11px;
      }

      .detail strong {
        font-size: 12px;
        font-weight: 400;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .options {
        display: grid;
        gap: 3px;
      }

      .hint {
        color: var(--muted);
        font-size: 11px;
      }

      .failure {
        color: var(--danger);
        font-size: 12px;
        margin-top: -4px;
      }

      .failure:empty {
        display: none;
      }

      .progress .failure {
        margin-top: 12px;
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 2px;
      }

      .progress .actions {
        align-items: center;
        margin-top: 18px;
      }

      .progress .actions .hint {
        margin-right: auto;
      }

      button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        height: 34px;
        padding: 0 14px;
      }

      button:hover:not(:disabled) {
        background: var(--hover);
      }

      button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #start {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }

      #start:hover:not(:disabled) {
        filter: brightness(1.06);
      }
    </style>
  </head>
  <body>
    <div class="setup" id="setup">
      <div class="format">
        <strong id="format-label">Selected format</strong>
        <span id="format-details"></span>
      </div>
      <div class="field browser-only" id="address-field">
        <label for="address">URL</label>
        <input
          id="address"
          class="address"
          type="text"
          readonly
          spellcheck="false"
        />
      </div>
      <div class="field">
        <label for="filename">File name</label>
        <input id="filename" type="text" spellcheck="false" />
      </div>
      <div class="field">
        <label for="directory">Save to</label>
        <div class="directory">
          <input id="directory" type="text" spellcheck="false" />
          <button id="choose" type="button">Choose…</button>
        </div>
      </div>
      <div class="meta browser-only">
        <label class="remember">
          <input id="remember" type="checkbox" />
          <span id="remember-label">Remember this folder</span>
        </label>
        <div class="source" id="source-row">
          <span class="source-label">From</span>
          <span class="source-title" id="source-title"></span>
        </div>
      </div>
      <div class="options">
        <label class="remember">
          <input id="show-progress" type="checkbox" />
          <span>Show progress in this window</span>
        </label>
        <span class="hint">The download continues in Gunda after this window closes.</span>
      </div>
      <div class="failure" id="setup-failure"></div>
      <div class="actions">
        <button id="cancel" type="button">Cancel</button>
        <button id="start" type="button">Start download</button>
      </div>
    </div>

    <div class="progress" id="progress">
      <h1 id="name">Preparing download</h1>
      <div class="source-line" id="progress-source"></div>
      <div class="summary">
        <div class="status-line">
          <span class="state" id="state">Connecting to Gunda…</span>
          <span class="percent" id="percent">0%</span>
        </div>
        <div class="track"><div class="bar" id="bar"></div></div>
        <div class="metrics">
          <div class="metric"><span>Downloaded</span><strong id="written">0 B</strong></div>
          <div class="metric"><span>File size</span><strong id="total">Size unknown</strong></div>
          <div class="metric"><span>Speed</span><strong id="speed">-</strong></div>
          <div class="metric"><span>Time left</span><strong id="remaining">-</strong></div>
        </div>
      </div>
      <div class="details">
        <div class="detail">
          <span id="folder-label">Folder</span>
          <strong id="folder">-</strong>
        </div>
      </div>
      <div class="failure" id="failure"></div>
      <div class="actions">
        <span class="hint">The download continues in Gunda.</span>
        <button id="close" type="button">Close</button>
      </div>
    </div>
    <script src="download.js"></script>
  </body>
</html>
