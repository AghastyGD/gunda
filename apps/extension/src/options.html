<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gunda Capture</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f3eb;
        --surface: #efeae0;
        --line: #d8d0c0;
        --text: #241f18;
        --muted: #6b6355;
        --accent: #8c5314;
        --accent-ink: #fff7e8;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --bg: #16140f;
          --surface: #1d1a14;
          --line: #342f25;
          --text: #efe9de;
          --muted: #a69d8c;
          --accent: #e2a855;
          --accent-ink: #1b1710;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        margin: 0 auto;
        max-width: 680px;
        padding: 40px 24px 48px;
      }

      h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }

      .lead {
        color: var(--muted);
        margin: 6px 0 0;
        max-width: 46ch;
      }

      .status {
        color: var(--muted);
        font-size: 12px;
        margin-top: 20px;
        min-height: 18px;
        white-space: pre-wrap;
      }

      h2 {
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        margin: 28px 0 10px;
      }

      .field {
        display: grid;
        gap: 5px;
        margin-bottom: 14px;
      }

      .field label {
        color: var(--muted);
        font-size: 11px;
      }

      input {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        padding: 8px 10px;
        width: 100%;
      }

      input:focus {
        border-color: var(--accent);
        outline: 2px solid color-mix(in srgb, var(--accent) 22%, transparent);
      }

      .hint {
        color: var(--muted);
        font-size: 11px;
        margin: 2px 0 0;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 20px;
      }

      button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-weight: 500;
        height: 34px;
        padding: 0 14px;
      }

      button:hover {
        background: var(--line);
      }

      #save {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }

      #save:hover {
        filter: brightness(1.06);
      }

      .diagnostics {
        border-top: 1px solid var(--line);
        margin-top: 32px;
        padding-top: 12px;
      }

      summary {
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
        list-style: none;
        padding: 4px 0;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::before {
        content: "+";
        display: inline-block;
        margin-right: 6px;
        width: 10px;
      }

      .diagnostics[open] summary::before {
        content: "−";
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 10px;
        padding: 10px 12px;
      }

      .label {
        color: var(--muted);
        display: block;
        font-size: 11px;
        margin-bottom: 2px;
      }

      .value {
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Gunda Capture</h1>
    <p class="lead">
      Gunda pairs automatically once the desktop app has run. Use these fields only if it did not.
    </p>

    <div class="status" id="status">Not started yet.</div>

    <h2>Pairing</h2>
    <div class="field">
      <label for="endpoint">Endpoint</label>
      <input id="endpoint" type="text" spellcheck="false" placeholder="ws://127.0.0.1:48123/capture" />
    </div>
    <div class="field">
      <label for="token">Pairing token</label>
      <input id="token" type="password" spellcheck="false" placeholder="64 hexadecimal characters" />
      <p class="hint">Stored by the extension and sent only to the endpoint above.</p>
    </div>

    <div class="actions">
      <button id="save" type="button">Save and connect</button>
      <button id="clear" type="button">Forget pairing</button>
    </div>

    <details class="diagnostics">
      <summary>Diagnostics</summary>
      <div class="card">
        <span class="label">Activity</span>
        <div class="value" id="stats">Nothing reported yet.</div>
      </div>
      <div class="card">
        <span class="label">Last browser download</span>
        <div class="value" id="last-download">None seen yet.</div>
      </div>
    </details>

    <script src="options.js"></script>
  </body>
</html>
